<!-- Auth Panel: Login & Register -->
<div class="auth-container">
  <div class="auth-card">
    <!-- Header -->
    <div class="auth-header">
      <div class="auth-logo">🛡️</div>
      <h1 class="auth-title">TBD Logger</h1>
      <p class="auth-subtitle">Capstone Integrity Tool</p>
    </div>

    <!-- Tab buttons -->
    <div class="auth-tabs">
      <button id="auth-tab-signin" class="auth-tab-btn active">Sign In</button>
      <button id="auth-tab-register" class="auth-tab-btn">Register</button>
    </div>

    <!-- Sign In form -->
    <div id="auth-signin-panel" class="auth-panel">
      <div class="form-group">
        <label for="signin-email">Email Address</label>
        <input
          type="text"
          id="signin-email"
          placeholder="student@school.edu"
          autocomplete="email"
        />
      </div>
      <div class="form-group">
        <label for="signin-password">
          Password
        </label>
        <div class="password-wrapper">
          <input
            type="password"
            id="signin-password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="toggle-pw"
            data-target="signin-password"
            title="Show/hide password"
          >
            👁
          </button>
        </div>
      </div>
      <div id="signin-error" class="auth-error hidden"></div>
      <button id="btn-signin" class="auth-submit-btn">Sign In</button>
      <p class="auth-switch-hint">
        Don't have an account?
        <button type="button" class="link-btn" id="go-to-register">
          Register here
        </button>
      </p>
    </div>

    <!-- Register form -->
    <div id="auth-register-panel" class="auth-panel hidden">
      <div class="form-group">
        <label for="register-name">Full Name</label>
        <input
          type="text"
          id="register-name"
          placeholder="Jane Smith"
          autocomplete="name"
        />
      </div>
      <div class="form-group">
        <label for="register-email">Email Address</label>
        <input
          type="text"
          id="register-email"
          placeholder="student@school.edu"
          autocomplete="email"
        />
      </div>
      <div class="form-group">
        <label for="register-password">Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="register-password"
            placeholder="Create a password (min 4 chars)"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="toggle-pw"
            data-target="register-password"
            title="Show/hide password"
          >
            👁
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="register-confirm">Confirm Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="register-confirm"
            placeholder="Repeat your password"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="toggle-pw"
            data-target="register-confirm"
            title="Show/hide password"
          >
            👁
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="register-role">Role</label>
        <div class="custom-dropdown" id="register-role-dropdown">
          <input type="hidden" id="register-role" value="Student" />
          <button
            type="button"
            class="custom-dropdown-trigger"
            id="register-role-trigger"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span id="register-role-label">Student</span>
            <span class="custom-dropdown-chevron" aria-hidden="true">▾</span>
          </button>
          <div class="custom-dropdown-menu hidden" id="register-role-menu" role="listbox" aria-label="Register role options">
            <button type="button" class="custom-dropdown-option" data-value="Student" role="option" aria-selected="true">Student</button>
            <button type="button" class="custom-dropdown-option" data-value="Teacher" role="option" aria-selected="false">Teacher</button>
          </div>
        </div>
      </div>
      <div class="form-group" id="register-consent-group">
        <label
          style="
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-weight: normal;
            font-size: 0.9em;
            cursor: pointer;
          "
        >
          <input
            type="checkbox"
            id="register-consent"
            style="margin-top: 3px"
          />
          <span
            >I consent to my coding activity being recorded for academic
            integrity purposes.</span
          >
        </label>
      </div>
      <div id="register-error" class="auth-error hidden"></div>
      <button id="btn-register" class="auth-submit-btn">Create Account</button>
      <p class="auth-switch-hint">
        Already have an account?
        <button type="button" class="link-btn" id="go-to-signin">
          Sign in here
        </button>
      </p>
    </div>

    <!-- Success state -->
    <div id="auth-success-panel" class="auth-panel hidden">
      <div class="auth-success">
        <div class="auth-success-icon">✓</div>
        <h2 id="auth-success-title">Signed In!</h2>
        <p id="auth-success-msg" class="auth-success-sub"></p>
      </div>
    </div>

    <!-- Custom consent dialog -->
    <div id="tracking-consent-modal" class="custom-modal hidden" aria-hidden="true">
      <div class="custom-modal-backdrop"></div>
      <div class="custom-modal-card" role="dialog" aria-modal="true" aria-labelledby="tracking-consent-title" aria-describedby="tracking-consent-message">
        <div class="custom-modal-icon" aria-hidden="true">!</div>
        <div class="custom-modal-copy">
          <h3 id="tracking-consent-title">Confirm without consent?</h3>
          <p id="tracking-consent-message">
            Are you sure you want to continue without tracking consent?
          </p>
        </div>
        <div class="custom-modal-actions">
          <button type="button" class="custom-modal-btn secondary" id="tracking-consent-cancel">Cancel</button>
          <button type="button" class="custom-modal-btn primary" id="tracking-consent-continue">Continue</button>
        </div>
      </div>
    </div>
  </div>
</div>
